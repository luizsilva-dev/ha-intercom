name: Intercom
version: "2.0.3"
slug: ha_intercom
description: Intercom bidirecional entre dispositivos HA via WebRTC
url: https://github.com/luizsilva-dev/ha-intercom
arch:
  - aarch64
  - amd64
startup: application
boot: auto
auto_update: true
watchdog: "http://[HOST]:8099/health"
map:
  - config:rw
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Intercom API & panel
hassio_api: true
hassio_role: manager
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:phone
panel_title: Intercom
panel_admin: false
options:
  call_timeout: 30
  max_call_duration: 300
  log_level: info
schema:
  call_timeout: int
  max_call_duration: int
  log_level: "list(debug|info|warning|error)"
