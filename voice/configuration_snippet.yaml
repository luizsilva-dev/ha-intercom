# Add ONLY this to your Home Assistant configuration.yaml, then restart HA.
# The Intercom addon will automatically create all call scripts in HA.

rest_command:
  intercom_call:
    url: "http://localhost:8099/api/voice/call"
    method: POST
    content_type: "application/json"
    payload: '{"callee_name": "{{ callee_name }}"}'
  intercom_answer:
    url: "http://localhost:8099/api/voice/answer"
    method: POST
  intercom_reject:
    url: "http://localhost:8099/api/voice/reject"
    method: POST
  intercom_hangup:
    url: "http://localhost:8099/api/voice/hangup"
    method: POST
