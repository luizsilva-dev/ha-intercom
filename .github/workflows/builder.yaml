name: Builder

on:
  push:
    branches:
      - main
    paths:
      - "ha-intercom/**"
  pull_request:
    branches:
      - main
    paths:
      - "ha-intercom/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish image to ghcr.io"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ha-intercom
      publish: ${{ github.event_name == 'push' || inputs.publish == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
